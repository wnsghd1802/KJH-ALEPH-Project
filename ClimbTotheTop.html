<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2D Ball Climber</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1f18;font-family:Arial,"Noto Sans KR",sans-serif}
#gameShell{
  position:relative;width:min(760px,100vw);height:100vh;margin:auto;overflow:hidden;
  background:#153b2e;border-left:2px solid #203b30;border-right:2px solid #203b30;
}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
#hud{position:absolute;top:18px;left:20px;z-index:3;color:#fff;text-shadow:0 3px 0 #13221c,0 5px 10px rgba(0,0,0,.55)}
#hud b{font-size:26px;font-weight:900;letter-spacing:.5px}
#hint{font-size:12px;color:#d7ead8;margin-top:4px}
#overlay{
 position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
 background:rgba(5,15,10,.52);color:#fff;z-index:10;text-align:center;
}
.panel{padding:34px 42px;border:2px solid rgba(255,255,255,.22);border-radius:22px;background:rgba(10,35,25,.82)}
h1{margin:0 0 12px;font-size:42px;letter-spacing:2px}
p{line-height:1.6;color:#dceadf}
button{font-size:20px;font-weight:bold;padding:14px 32px;border:0;border-radius:12px;cursor:pointer;background:#f0b43c;color:#2d1b05}
</style>
</head>
<body>
<div id="gameShell">
  <canvas id="game"></canvas>
  <div id="hud"><b>높이: <span id="score">0</span>m</b></div>
  <div id="overlay"><div class="panel">
    <h1 id="title">BALL CLIMBER</h1>
    <p id="message">왼쪽 클릭으로 시작<br>마우스를 움직여 공을 좌우로 이동하세요.</p>
    <button id="startBtn">START</button>
  </div></div>
</div>

<script>
const shell=document.getElementById('gameShell');
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');

const overlay=document.getElementById('overlay');
const title=document.getElementById('title');
const message=document.getElementById('message');
const scoreEl=document.getElementById('score');

let W,H,mouseX=0,running=false,last=0;
let ball,platforms=[],items=[],cameraY=0,score=0;
let superJumpUntil=0,fogUntil=0,cleared=false;
const PLATFORM_COUNT=180;
const WORLD_STEP_MIN=82, WORLD_STEP_MAX=112;

function resize(){
 W=shell.clientWidth; H=shell.clientHeight;
 canvas.width=W; canvas.height=H;
 if(!mouseX) mouseX=W/2;
}
addEventListener('resize',resize);resize();

shell.addEventListener('mousemove',e=>{
 const r=shell.getBoundingClientRect();
 mouseX=Math.max(0,Math.min(W,e.clientX-r.left));
});

function rand(a,b){return a+Math.random()*(b-a)}

function makeGame(){
 ball={x:W/2,y:H-115,r:18,vy:-900};
 platforms=[];items=[];cameraY=0;score=0;cleared=false;
 superJumpUntil=0;fogUntil=0;

 platforms.push({
   x:W/2-135,y:H-52,w:270,h:20,type:'solid',dead:false,vanishAt:null,triggered:false
 });

 let y=H-155,prevX=W/2-65;
 for(let i=0;i<PLATFORM_COUNT;i++){
   y-= i<3 ? rand(68,82) : rand(WORLD_STEP_MIN,WORLD_STEP_MAX);
   const w=rand(108,145);

   // 760px 폭 안에서 대략 180~300px 거리의 2D 배치
   const gap=rand(170,300);
   const dir=Math.random()<.5?-1:1;
   let x=prevX+dir*gap;
   if(x<16 || x>W-w-16) x=prevX-dir*gap;
   x=Math.max(16,Math.min(W-w-16,x));

   const type=Math.random()<.22?'vanish':'solid';
   const p={x,y,w,h:18,type,dead:false,vanishAt:null,triggered:false};
   platforms.push(p);

   // 발판과 아이템 모두 게임 시작마다 새 랜덤 생성
   if(i>2 && Math.random()<.22){
     const r=Math.random();
     const itemType=r<.38?'super':r<.68?'boost200':'fog';
     items.push({
       x:x+w*rand(.25,.75),
       y:y-30,
       r:16,
       type:itemType,
       dead:false
     });
   }
   prevX=x;
 }
 // 마지막 발판은 CLEAR 발판
 const top=platforms[platforms.length-1];
 top.type='goal';
 scoreEl.textContent='0';
}

function start(){
 makeGame();
 running=true;
 overlay.style.display='none';
 last=performance.now();
 requestAnimationFrame(loop);
}
document.getElementById('startBtn').onclick=start;
shell.addEventListener('mousedown',e=>{if(e.button===0&&!running)start()});

function update(dt,now){
 // 빠르지만 부드러운 마우스 추적, 관성으로 과하게 날아가지 않음
 const follow=15;
 const a=1-Math.exp(-follow*dt);
 ball.x+=(mouseX-ball.x)*a;
 ball.x=Math.max(ball.r,Math.min(W-ball.r,ball.x));

 ball.vy+=1800*dt;
 ball.y+=ball.vy*dt;

 for(const p of platforms){
   if(!p.dead && p.vanishAt!==null && now>=p.vanishAt) p.dead=true;
 }

 if(ball.vy>0){
   for(const p of platforms){
     if(p.dead)continue;
     const hitX=ball.x+ball.r>p.x && ball.x-ball.r<p.x+p.w;
     const hitY=ball.y+ball.r>=p.y && ball.y+ball.r<=p.y+p.h+26 && ball.y-ball.r<p.y;
     if(hitX&&hitY){
       ball.y=p.y-ball.r;
       if(p.type==='goal'){
         clearGame();
         return;
       }
       ball.vy=now<superJumpUntil?-1220:-900;
       if(p.type==='vanish'&&!p.triggered){
         p.triggered=true;
         p.vanishAt=now+300;
       }
       break;
     }
   }
 }

 for(const item of items){
   if(item.dead)continue;
   if(Math.hypot(ball.x-item.x,ball.y-item.y)<ball.r+item.r){
     item.dead=true;
     if(item.type==='super') superJumpUntil=now+7000;
     else if(item.type==='boost200') ball.vy=-1900;
     else fogUntil=now+5000;
   }
 }

 const sy=ball.y-cameraY;
 if(sy<H*.40)cameraY=ball.y-H*.40;

 for(const p of platforms){
   if(!p.dead&&p.y-cameraY>H+80)p.dead=true;
 }
 items=items.filter(i=>!i.dead&&i.y-cameraY<H+130);

 score=Math.max(score,Math.floor(((H-55)-ball.y)/10));
 scoreEl.textContent=Math.max(0,score);

 if(ball.y-cameraY>H+100)gameOver();
}

function gameOver(){
 running=false;
 title.textContent='GAME OVER';
 message.innerHTML='도달 높이: <b>'+Math.max(0,score)+'m</b><br>다시 도전해보세요!';
 document.getElementById('startBtn').textContent='RETRY';
 overlay.style.display='flex';
}
function clearGame(){
 if(cleared)return;
 cleared=true;running=false;
 title.textContent='CLEAR!';
 message.innerHTML='🎉 맨 위층까지 도달했습니다! 🎉<br>최종 높이: <b>'+Math.max(0,score)+'m</b>';
 document.getElementById('startBtn').textContent='PLAY AGAIN';
 overlay.style.display='flex';
}

function drawForest(){
  // 고정된 2D 숲 배경: cameraY를 전혀 사용하지 않음
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#0d2923');
  sky.addColorStop(.34,'#315f51');
  sky.addColorStop(.68,'#507d69');
  sky.addColorStop(1,'#173c31');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);

  // 숲 중앙의 햇빛
  const glow=ctx.createRadialGradient(W*.52,H*.25,10,W*.52,H*.42,H*.58);
  glow.addColorStop(0,'rgba(245,242,188,.62)');
  glow.addColorStop(.28,'rgba(201,225,170,.22)');
  glow.addColorStop(1,'rgba(110,170,125,0)');
  ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);

  // 먼 산과 숲
  ctx.fillStyle='#497666';
  ctx.beginPath();
  ctx.moveTo(0,H*.62);
  for(let x=-40;x<=W+50;x+=45){
    const peak=H*.43+((x*17)%90+90)%90;
    ctx.lineTo(x+22,peak);ctx.lineTo(x+45,H*.62);
  }
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fill();

  // 먼 나무 레이어
  for(let i=0;i<18;i++){
    const x=(i*73)%W, base=H*.80-((i*29)%130);
    ctx.fillStyle=i%2?'#2d6253':'#245646';
    ctx.fillRect(x+12,base-58,8,75);
    ctx.beginPath();
    ctx.moveTo(x,base-52);ctx.lineTo(x+16,base-118);ctx.lineTo(x+35,base-52);
    ctx.lineTo(x+25,base-52);ctx.lineTo(x+44,base-25);ctx.lineTo(x-7,base-25);
    ctx.closePath();ctx.fill();
  }

  // 양쪽 큰 나무 줄기
  function trunk(x,side){
    const tw=side===0?54:62;
    const grad=ctx.createLinearGradient(x,0,x+tw,0);
    grad.addColorStop(0,'#211b15');
    grad.addColorStop(.48,'#604329');
    grad.addColorStop(1,'#2c2118');
    ctx.fillStyle=grad;
    ctx.beginPath();
    ctx.moveTo(x,H);
    ctx.lineTo(x+tw,H);
    ctx.lineTo(x+tw*.72,0);
    ctx.lineTo(x+tw*.20,0);
    ctx.closePath();ctx.fill();

    ctx.strokeStyle='rgba(188,122,65,.28)';
    ctx.lineWidth=4;
    for(let yy=40;yy<H;yy+=58){
      ctx.beginPath();
      ctx.moveTo(x+tw*.45,yy);
      ctx.lineTo(x+tw*.35,yy+34);
      ctx.stroke();
    }

    // 가지
    ctx.strokeStyle='#2c2118';ctx.lineWidth=12;ctx.lineCap='round';
    ctx.beginPath();
    if(side===0){
      ctx.moveTo(x+tw*.58,H*.28);ctx.lineTo(x+95,H*.17);
      ctx.moveTo(x+tw*.55,H*.48);ctx.lineTo(x+82,H*.42);
    }else{
      ctx.moveTo(x+tw*.38,H*.25);ctx.lineTo(x-58,H*.13);
      ctx.moveTo(x+tw*.42,H*.48);ctx.lineTo(x-58,H*.40);
    }
    ctx.stroke();
  }
  trunk(8,0); trunk(W-70,1);

  // 큰 수관
  function canopy(cx,cy,scale){
    ctx.fillStyle='#092d25';
    for(const [dx,dy,r] of [[0,0,48],[38,18,44],[-36,20,46],[14,58,52],[-26,70,42]]){
      ctx.beginPath();ctx.arc(cx+dx*scale,cy+dy*scale,r*scale,0,Math.PI*2);ctx.fill();
    }
    ctx.fillStyle='rgba(30,82,59,.8)';
    for(const [dx,dy,r] of [[-12,5,25],[28,34,22],[-37,48,22],[4,74,27]]){
      ctx.beginPath();ctx.arc(cx+dx*scale,cy+dy*scale,r*scale,0,Math.PI*2);ctx.fill();
    }
  }
  canopy(20,20,1.0);canopy(W-24,30,1.05);
  canopy(70,H*.67,.72);canopy(W-90,H*.68,.72);

  // 아래쪽 숲길/개울 느낌
  ctx.fillStyle='rgba(97,142,125,.28)';
  ctx.beginPath();
  ctx.moveTo(W*.43,H);ctx.lineTo(W*.58,H);
  ctx.lineTo(W*.54,H*.60);ctx.lineTo(W*.48,H*.60);
  ctx.closePath();ctx.fill();

  // 앞쪽 수풀
  for(let x=-10;x<W+25;x+=32){
    const y=H-35-(((x*31)%70+70)%70);
    ctx.fillStyle=(x%64===0)?'#0c3428':'#114534';
    ctx.beginPath();
    ctx.arc(x+12,y,24,Math.PI,0);
    ctx.arc(x+28,y+4,22,Math.PI,0);
    ctx.lineTo(x+52,H);ctx.lineTo(x-8,H);ctx.closePath();ctx.fill();
  }

  // 반딧불
  for(let i=0;i<14;i++){
    const x=(i*113+37)%W, y=90+((i*149)%(Math.max(150,H-150)));
    const a=.25+(i%4)*.1;
    ctx.fillStyle='rgba(245,226,84,'+a+')';
    ctx.beginPath();ctx.arc(x,y,2.2,0,Math.PI*2);ctx.fill();
  }
}
function drawWood(p,py){
  const x=p.x,y=py,w=p.w,h=p.h||20;
  const isVanish=p.type==='vanish';

  // 발판 그림자
  ctx.fillStyle='rgba(0,0,0,.34)';
  ctx.beginPath();ctx.roundRect(x+5,y+h+5,w,9,5);ctx.fill();

  // 어두운 외곽
  ctx.fillStyle='#26180f';
  ctx.beginPath();ctx.roundRect(x-3,y-3,w+6,h+9,5);ctx.fill();

  // 통나무 본체
  const g=ctx.createLinearGradient(0,y,0,y+h+4);
  g.addColorStop(0,'#c17a38');
  g.addColorStop(.18,'#9a5727');
  g.addColorStop(.72,'#70401f');
  g.addColorStop(1,'#3c2416');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.roundRect(x,y,w,h+4,4);ctx.fill();

  // 상단 하이라이트와 나무 결
  ctx.fillStyle='rgba(255,189,101,.22)';
  ctx.fillRect(x+6,y+3,w-12,2);
  ctx.strokeStyle='rgba(47,24,12,.7)';ctx.lineWidth=1.6;
  ctx.beginPath();
  ctx.moveTo(x+12,y+h*.48);ctx.lineTo(x+w*.38,y+h*.48);
  ctx.moveTo(x+w*.63,y+h*.48);ctx.lineTo(x+w-12,y+h*.48);
  ctx.stroke();

  // 이끼
  ctx.fillStyle='#426f31';
  for(let xx=x+8;xx<x+w-6;xx+=15){
    if((((xx*3+p.y)|0)%4)<2) ctx.fillRect(xx,y-2,9,3);
  }

  // 사라지는 발판: 블록 중간을 명확하게 가로지르는 사선 금 하나
  if(isVanish){
    const x1=x+w*.46, y1=y-1;
    const x2=x+w*.58, y2=y+h+5;

    // 밝은 한쪽 단면
    ctx.strokeStyle='rgba(230,152,83,.85)';
    ctx.lineWidth=4;
    ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(x1+2,y1);ctx.lineTo(x2+2,y2);ctx.stroke();

    // 검은 사선 금
    ctx.strokeStyle='#180b07';
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(x1,y1);
    ctx.lineTo(x1+7,y+7);
    ctx.lineTo(x2-2,y+13);
    ctx.lineTo(x2,y2);
    ctx.stroke();

    // 작은 갈래 하나
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(x1+7,y+7);ctx.lineTo(x1+17,y+4);ctx.stroke();
  }
}
function drawItem(i,iy){
  ctx.save();ctx.translate(i.x,iy);

  // common glow
  const glow=ctx.createRadialGradient(0,0,2,0,0,34);
  glow.addColorStop(0,'rgba(255,210,70,.26)');glow.addColorStop(1,'rgba(255,210,70,0)');
  ctx.fillStyle=glow;ctx.beginPath();ctx.arc(0,0,34,0,Math.PI*2);ctx.fill();

  if(i.type==='boost200'){
    // spring booster
    ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(0,15,17,4,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#343a3f';ctx.beginPath();ctx.roundRect(-17,9,34,8,3);ctx.fill();
    ctx.fillStyle='#9aa2a4';ctx.fillRect(-12,10,24,3);
    ctx.strokeStyle='#d8e0df';ctx.lineWidth=4;ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(-10,8);ctx.lineTo(8,3);ctx.lineTo(-8,-2);ctx.lineTo(9,-8);ctx.stroke();
    ctx.strokeStyle='#566065';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(-10,8);ctx.lineTo(8,3);ctx.lineTo(-8,-2);ctx.lineTo(9,-8);ctx.stroke();
    const top=ctx.createLinearGradient(0,-17,0,-6);
    top.addColorStop(0,'#ffd45d');top.addColorStop(1,'#e88018');
    ctx.fillStyle=top;ctx.beginPath();ctx.roundRect(-17,-18,34,10,5);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.55)';ctx.fillRect(-8,-15,15,2);
  } else if(i.type==='super'){
    // winged orange boot
    ctx.fillStyle='#e9ece6';ctx.strokeStyle='#7e8c86';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(-7,-5);ctx.quadraticCurveTo(-28,-23,-30,-8);ctx.quadraticCurveTo(-23,2,-10,4);
    ctx.quadraticCurveTo(-24,7,-25,13);ctx.quadraticCurveTo(-10,11,-3,5);ctx.closePath();ctx.fill();ctx.stroke();
    const shoe=ctx.createLinearGradient(-8,-10,17,13);
    shoe.addColorStop(0,'#ffbd50');shoe.addColorStop(.5,'#f16b12');shoe.addColorStop(1,'#8c3109');
    ctx.fillStyle=shoe;ctx.beginPath();
    ctx.moveTo(-12,7);ctx.lineTo(-6,-12);ctx.lineTo(7,-10);ctx.lineTo(11,1);ctx.lineTo(19,6);ctx.lineTo(17,14);ctx.lineTo(-15,14);ctx.closePath();ctx.fill();
    ctx.strokeStyle='#55200a';ctx.stroke();
    ctx.fillStyle='#fff2d0';ctx.fillRect(-4,-6,9,2);ctx.fillRect(-3,-2,10,2);
    ctx.fillStyle='rgba(255,255,255,.65)';ctx.beginPath();ctx.ellipse(12,5,4,2,0,0,Math.PI*2);ctx.fill();
  } else {
    // storm cloud
    ctx.fillStyle='#202638';ctx.strokeStyle='#111622';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(-10,4,10,0,Math.PI*2);ctx.arc(1,-2,13,0,Math.PI*2);ctx.arc(13,5,10,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.fillStyle='#596078';ctx.beginPath();ctx.arc(-4,-5,5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ad68ff';ctx.beginPath();ctx.moveTo(2,11);ctx.lineTo(-7,24);ctx.lineTo(0,21);ctx.lineTo(-3,31);ctx.lineTo(11,15);ctx.lineTo(4,17);ctx.closePath();ctx.fill();
  }
  ctx.restore();
}
function draw(){
 const bg=ctx.createLinearGradient(0,0,0,H);
 bg.addColorStop(0,'#2c6751');bg.addColorStop(1,'#0d2a20');
 ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 drawForest();

 for(const p of platforms){
   if(p.dead)continue;
   const py=p.y-cameraY;
   if(py<-50||py>H+50)continue;
   drawWood(p,py);
 }

 for(const i of items){
   const iy=i.y-cameraY;
   if(iy>-50&&iy<H+50)drawItem(i,iy);
 }

 const by=ball.y-cameraY;
 ctx.beginPath();ctx.arc(ball.x,by,ball.r,0,Math.PI*2);
 ctx.fillStyle='#f2f4ee';ctx.fill();
 ctx.strokeStyle='#c7cdc6';ctx.lineWidth=2;ctx.stroke();
 ctx.fillStyle='rgba(255,255,255,.8)';
 ctx.beginPath();ctx.arc(ball.x-6,by-7,5,0,Math.PI*2);ctx.fill();

 if(performance.now()<fogUntil){
   // 공 주변만 보이고, 원 밖의 게임 화면은 완전히 가림
   const vision=105;
   ctx.save();
   ctx.fillStyle='rgba(0,0,0,1)';
   ctx.beginPath();
   ctx.rect(0,0,W,H);
   ctx.arc(ball.x,by,vision,0,Math.PI*2,true);
   ctx.fill('evenodd');

   ctx.restore();
 }
}

function loop(t){
 if(!running)return;
 const dt=Math.min(.03,(t-last)/1000||.016);
 last=t;update(dt,t);draw();
 if(running)requestAnimationFrame(loop);
}
draw();
</script>
</body>
</html>
